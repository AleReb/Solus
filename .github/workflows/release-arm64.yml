name: ARM64 binary release

on:
  workflow_dispatch:
  push:
    branches: [raspberry-pi-arm64]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.github/workflows/release-arm64.yml'

permissions:
  contents: write

concurrency:
  group: arm64-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AleReb/Solus'
    runs-on: ubuntu-24.04-arm
    container: debian:13-slim
    timeout-minutes: 60
    steps:
      - name: Install build and release tools
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libssl-dev ca-certificates curl git file python3 gh util-linux

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build for Debian 13 ARM64
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo build --release --locked --jobs 2 --config 'profile.release.package.solus.opt-level=1'
          file target/release/solus
          runuser -u nobody -- python3 scripts/raspberry-pi/check_install.py "$PWD/target/release/solus"

      - name: Package binary and metadata
        run: |
          mkdir release-arm64
          cp target/release/solus release-arm64/solus-linux-aarch64
          cp LICENSE release-arm64/LICENSE
          printf 'source_commit=%s\nbuild_os=Debian 13\narchitecture=aarch64\n' "$GITHUB_SHA" > release-arm64/BUILD-INFO.txt
          cd release-arm64
          sha256sum solus-linux-aarch64 > SHA256SUMS-arm64.txt

      - name: Publish immutable ARM64 release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          tag="arm64-$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)"
          printf 'Linux ARM64 binary built on GitHub for Debian 13 / Raspberry Pi OS 64-bit.\n\nSource: %s\n\nUse scripts/raspberry-pi/install-release.sh to install without compiling.\n' "$GITHUB_SHA" > /tmp/arm64-release-notes.md
          gh release create "$tag" release-arm64/* --repo "$RELEASE_REPO" --target "$GITHUB_SHA" \
            --title "Solus ARM64 $(git rev-parse --short=7 HEAD)" --notes-file /tmp/arm64-release-notes.md
